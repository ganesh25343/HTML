<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Layout</title>
</head>
<body>
<table border="2px" cellspacing="0px" cellpadding="10px" width="300px" height="400px">
    <tr>
        <td colspan="2"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td colspan="2">
            <table border="2px" width="100px" height="100px" cellspacing="0px">
                <tr>
                    <td></td>
                </tr>
            </table>
        </td>
        <td></td>
        <td></td>
        <td colspan="2"></td>
    </tr>
    <tr>
        <td colspan="2"></td>
        <td colspan="2"></td>
        <td colspan="2" rowspan="2">
        <table border="2px" width="100px" height="100px" cellspacing="0px" cellpadding="10px
        " >
            <tr>
                <td></td>
                <td rowspan="2"></td>
            </tr>
            <tr>
                <td></td>
                <!-- <td></td> -->
            </tr>
        </table>
        </td>
    </tr>
    <tr>
        <td colspan="2"></td>
        <td></td>
        <td></td>
    </tr>
</table>
</body>
</html>
